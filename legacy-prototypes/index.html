<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home · Ultimate Mets Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --mets-blue: #002D72; --mets-blue-dark: #001A4A; --mets-orange: #FF5910;
    --mets-orange-light: #FF7A3D; --bg: #FAFAFA; --surface: #FFFFFF;
    --border: #E5E7EB; --text: #111827; --text-muted: #6B7280; --text-light: #9CA3AF;
    --num-font: 'Roboto Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; color: var(--text); background: var(--bg); line-height: 1.5; font-size: 14px; -webkit-font-smoothing: antialiased; }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  a { color: inherit; text-decoration: none; }

  .topbar { background: var(--mets-blue); color: white; border-bottom: 3px solid var(--mets-orange); }
  .topbar-inner { max-width: 1500px; margin: 0 auto; display: flex; align-items: center; padding: 0 24px; height: 56px; }
  .logo { font-weight: 800; font-size: 18px; color: var(--mets-orange); letter-spacing: -0.02em; }
  .logo span { color: white; }
  .nav { display: flex; gap: 4px; margin-left: 40px; flex: 1; }
  .nav button { color: white; padding: 8px 14px; font-size: 13px; font-weight: 500; border-radius: 6px; }
  .nav button:hover { background: rgba(255,255,255,0.1); }
  .nav button.active { background: var(--mets-orange); }
  .nav-tools { display: flex; gap: 12px; align-items: center; }
  .search { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 7px 12px; border-radius: 6px; font-size: 13px; width: 240px; outline: none; }
  .search::placeholder { color: rgba(255,255,255,0.6); }
  .signin { background: var(--mets-orange); color: white; padding: 7px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; }

  /* Hero */
  .hero { background: linear-gradient(135deg, var(--mets-blue) 0%, var(--mets-blue-dark) 100%); color: white; padding: 56px 0 48px; position: relative; overflow: hidden; }
  .hero::after { content: ''; position: absolute; right: -150px; top: -150px; width: 540px; height: 540px; background: radial-gradient(circle, rgba(255,89,16,0.20) 0%, transparent 60%); pointer-events: none; }
  .hero-inner { max-width: 1500px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }
  .hero-title { font-size: 52px; font-weight: 800; letter-spacing: -0.025em; line-height: 1; }
  .hero-title .accent { color: var(--mets-orange); }
  .hero-sub { font-size: 16px; color: rgba(255,255,255,0.85); margin-top: 14px; max-width: 620px; line-height: 1.55; }
  .hero-search { margin-top: 28px; max-width: 620px; position: relative; }
  .hero-search input { width: 100%; background: white; color: var(--text); padding: 14px 18px 14px 44px; border-radius: 10px; border: none; font-size: 15px; font-family: inherit; outline: none; box-shadow: 0 8px 24px rgba(0,0,0,0.18); }
  .hero-search::before { content: '🔍'; position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-size: 16px; opacity: 0.5; }
  .hero-search-meta { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 8px; font-family: var(--num-font); }
  .hero-stats { display: flex; gap: 36px; margin-top: 32px; flex-wrap: wrap; }
  .hero-stat { display: flex; flex-direction: column; }
  .hero-stat .num { font-family: var(--num-font); font-size: 30px; font-weight: 700; color: var(--mets-orange-light); line-height: 1; }
  .hero-stat .lbl { font-size: 11px; color: rgba(255,255,255,0.7); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 5px; }

  /* Sections */
  .section { max-width: 1500px; margin: 0 auto; padding: 32px 24px 8px; }
  .section-head { display: flex; justify-content: space-between; align-items: end; margin-bottom: 18px; }
  .section-title { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
  .section-sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .section-link { font-size: 12.5px; color: var(--mets-orange); font-weight: 600; }

  /* Two-column main */
  .main { max-width: 1500px; margin: 0 auto; padding: 32px 24px 0; display: grid; grid-template-columns: 1fr 320px; gap: 32px; align-items: start; }
  @media (max-width: 1100px) { .main { grid-template-columns: 1fr; } }

  /* Big section cards */
  .group-label { display: flex; align-items: center; gap: 10px; margin: 4px 0 14px; }
  .group-label .num { font-family: var(--num-font); font-size: 11px; color: var(--text-light); font-weight: 700; padding: 2px 8px; background: #F3F4F6; border-radius: 12px; letter-spacing: 0.04em; }
  .group-label .name { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text); }
  .group-label .desc { font-size: 12px; color: var(--text-muted); }

  .entry-grid { display: grid; gap: 14px; margin-bottom: 28px; }
  .entry-grid.three { grid-template-columns: repeat(3, 1fr); }
  .entry-grid.four { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 800px) { .entry-grid.three, .entry-grid.four { grid-template-columns: 1fr; } }

  .entry { display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px; cursor: pointer; transition: all 0.15s; position: relative; }
  .entry:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0,0,0,0.08); border-color: var(--mets-orange); }
  .entry .e-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
  .entry .e-icon {
    width: 44px; height: 44px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 800; color: white; flex-shrink: 0;
  }
  .entry .e-icon.players { background: linear-gradient(135deg, var(--mets-orange), var(--mets-orange-light)); }
  .entry .e-icon.seasons { background: linear-gradient(135deg, var(--mets-blue), #1E40AF); }
  .entry .e-icon.games   { background: linear-gradient(135deg, #10B981, #34D399); }
  .entry .e-icon.leaders { background: linear-gradient(135deg, #F59E0B, #FBBF24); }
  .entry .e-icon.post    { background: linear-gradient(135deg, var(--mets-blue-dark), var(--mets-blue)); }
  .entry .e-icon.lab     { background: linear-gradient(135deg, #8B5CF6, #A78BFA); }
  .entry .e-icon.media   { background: linear-gradient(135deg, #EC4899, #F472B6); }
  .entry .e-arrow { color: var(--text-light); font-size: 18px; transition: all 0.15s; }
  .entry:hover .e-arrow { color: var(--mets-orange); transform: translateX(4px); }
  .entry .e-title { font-size: 17px; font-weight: 700; margin-top: 14px; letter-spacing: -0.01em; }
  .entry .e-desc { font-size: 13px; color: var(--text-muted); margin-top: 6px; line-height: 1.5; }
  .entry .e-meta { font-size: 11px; color: var(--text-light); margin-top: 12px; font-family: var(--num-font); display: flex; gap: 12px; flex-wrap: wrap; }
  .entry .e-meta .pill { background: #F3F4F6; padding: 3px 8px; border-radius: 4px; font-weight: 600; }

  /* Today in history */
  .today-card { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .today-row { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .today-row:last-child { border-bottom: none; padding-bottom: 0; }
  .today-row:first-child { padding-top: 0; }
  .today-year { font-family: var(--num-font); font-size: 17px; font-weight: 800; color: var(--mets-orange); width: 50px; flex-shrink: 0; }
  .today-text { flex: 1; }
  .today-text .t { font-size: 13.5px; font-weight: 600; line-height: 1.35; }
  .today-text .t a { color: var(--mets-blue); border-bottom: 1px dotted var(--mets-blue); }
  .today-text .t a:hover { color: var(--mets-orange); border-color: var(--mets-orange); }
  .today-text .meta { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; font-family: var(--num-font); }

  /* Sidebar */
  .side-card { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .side-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: baseline; }
  .side-title .clr { font-size: 11px; color: var(--text-muted); cursor: pointer; text-transform: none; letter-spacing: 0; font-weight: 500; }
  .side-title .clr:hover { color: var(--mets-orange); }

  .recent-row { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid #F3F4F6; align-items: center; }
  .recent-row:last-child { border-bottom: none; }
  .recent-row a { display: flex; gap: 10px; flex: 1; align-items: center; }
  .recent-tag { font-size: 9.5px; padding: 2px 6px; border-radius: 3px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; flex-shrink: 0; color: white; }
  .recent-tag.players { background: var(--mets-orange); }
  .recent-tag.seasons { background: var(--mets-blue); }
  .recent-tag.games { background: #10B981; }
  .recent-tag.leaders { background: #F59E0B; }
  .recent-tag.postseason { background: var(--mets-blue-dark); }
  .recent-tag.lab { background: #8B5CF6; }
  .recent-tag.media { background: #EC4899; }
  .recent-name { font-size: 13px; font-weight: 500; flex: 1; min-width: 0; }
  .recent-row:hover .recent-name { color: var(--mets-orange); }
  .recent-empty { font-size: 12px; color: var(--text-muted); text-align: center; padding: 22px 14px; line-height: 1.5; }
  .recent-empty .hint { font-size: 11px; color: var(--text-light); margin-top: 6px; }

  .quicklink { display: block; padding: 9px 0; border-bottom: 1px solid #F3F4F6; font-size: 13px; }
  .quicklink:last-child { border-bottom: none; }
  .quicklink:hover .ql-name { color: var(--mets-orange); }
  .ql-name { font-weight: 600; }
  .ql-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; font-family: var(--num-font); }

  .footer { max-width: 1500px; margin: 32px auto 0; padding: 32px 24px; color: var(--text-muted); font-size: 12px; border-top: 1px solid var(--border); text-align: center; }
</style>
</head>
<body>
<div id="root"></div>

<script>
  // Force Babel's classic JSX runtime so it emits React.createElement (using the
  // global UMD React) instead of an `import "react/jsx-runtime"` the browser can't
  // resolve without a bundler.
  Babel.registerPreset('react-classic', {
    presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]],
  });
</script>
<script type="text/babel" data-presets="react-classic">
const { useState, useEffect } = React;

const NAV_ITEMS = ['Home','Players','Seasons','Games','Leaders','Postseason','Lab','Media'];
const NAV_HREF = {
  Home:       'index.html',
  Players:    'player-prototype-react.html',
  Seasons:    'season-prototype-react.html',
  Games:      'game-prototype-react.html',
  Leaders:    'leaders-prototype-react.html',
  Postseason: 'postseason-prototype-react.html',
  Lab:        'comparison-prototype-react.html',
  Media:      'media-prototype-react.html',
};

const DETAIL_ENTRIES = [
  { key: 'players', icon: '👤', title: 'Players', href: NAV_HREF.Players,
    desc: 'Career profiles for every Met — from Tom Seaver to Pete Alonso. Stats, splits, percentile rankings, and similarity scores.',
    meta: ['1,243 players', 'since 1962'] },
  { key: 'seasons', icon: '📅', title: 'Seasons', href: NAV_HREF.Seasons,
    desc: 'Year-by-year breakdowns. Schedule, standings, leaders, transactions, and the postseason path for every season since 1962.',
    meta: ['64 seasons', '1962 → 2025'] },
  { key: 'games', icon: '⚾', title: 'Games', href: NAV_HREF.Games,
    desc: 'Single-game recaps with box scores, play-by-play, win-probability charts, and fan discussion threads anchored to specific moments.',
    meta: ['10,000+ games', 'with discussion'] },
];

const TOOL_ENTRIES = [
  { key: 'leaders', icon: '🏆', title: 'Leaders', href: NAV_HREF.Leaders,
    desc: 'Career and single-season leaderboards. Filter by era, position, or playing-time minimum. Save your own custom views.',
    meta: ['All-time rankings', 'savable views'] },
  { key: 'post', icon: '🥇', title: 'Postseason', href: NAV_HREF.Postseason,
    desc: 'All 11 postseason runs in one place. Series-by-series drill-down, career postseason leaders, and the franchise\'s most famous moments.',
    meta: ['11 appearances', '2 WS · 5 NL pennants'] },
  { key: 'lab', icon: '⚗️', title: 'Lab', href: NAV_HREF.Lab,
    desc: 'Side-by-side comparison tool. Stack 2–4 players, overlay career arcs, compare 5-tool grades, and run a stat-by-stat showdown.',
    meta: ['Up to 4 players', '20-80 scouting scale'] },
  { key: 'media', icon: '🎬', title: 'Media', href: NAV_HREF.Media,
    desc: 'Searchable archive of videos, photos, articles, and podcasts. Filter by era, season, or player. Browse curated collections.',
    meta: ['12,824 items', 'video · photo · audio'] },
];

const TODAY_HISTORY = [
  { year: 1981, t: <>Cleon Jones returns to Shea Stadium for an Old-Timers Day appearance, drawing a 12-minute standing ovation.</>, meta: 'Old-Timers Day · Shea Stadium' },
  { year: 1996, t: <>Bernard Gilkey hits for the cycle vs the Padres — first Met to do it since Keith Hernandez in 1985.</>, meta: 'NYM 6, SDP 4 · 9 innings' },
  { year: 2008, t: <>Pedro Martinez throws 7 shutout innings in his return from injury — <a href="player-prototype-react.html">view game</a>.</>, meta: 'NYM 4, LAD 0' },
  { year: 2015, t: <>Lucas Duda hits walk-off HR vs the Phillies in the 11th. — Mets pull within 1 game of NL East lead.</>, meta: 'NYM 5, PHI 4 (11)' },
  { year: 2024, t: <>Pete Alonso passes Darryl Strawberry for 2nd on the franchise career HR list (253).</>, meta: 'NYM 7, ATL 3' },
];

const TRENDING = [
  { name: 'Pete Alonso', meta: 'Player · 1B · 226 HR as a Met', href: NAV_HREF.Players },
  { name: '2024 Mets',   meta: 'Season · 89-73 · NLCS',         href: NAV_HREF.Seasons },
  { name: '1986 World Series Game 6', meta: 'Game · Oct 25, 1986', href: NAV_HREF.Games },
  { name: 'Career bWAR Leaders',      meta: 'Leaders · all-time',   href: NAV_HREF.Leaders },
  { name: 'Wright vs Hernandez vs HoJo', meta: 'Lab · 3-way compare', href: NAV_HREF.Lab },
];

function TopBar() {
  return (
    <header className="topbar">
      <div className="topbar-inner">
        <div className="logo">ULTIMATE<span>METS</span></div>
        <nav className="nav">
          {NAV_ITEMS.map(n => (
            <button key={n} className={n==='Home'?'active':''} onClick={()=>{ if(n!=='Home') window.location.href = NAV_HREF[n]; }}>{n}</button>
          ))}
        </nav>
        <div className="nav-tools">
          <input className="search" placeholder="Search players, seasons, games..." />
          <button className="signin">Sign In</button>
        </div>
      </div>
    </header>
  );
}

function Hero() {
  return (
    <section className="hero">
      <div className="hero-inner">
        <h1 className="hero-title">Ultimate <span className="accent">Mets</span><br/>Database</h1>
        <p className="hero-sub">Every player, every season, every game, every postseason moment in franchise history — searchable, comparable, and connected.</p>
        <div className="hero-search">
          <input placeholder='Try "David Wright", "1986 World Series", "Pete Alonso HR"...' />
          <div className="hero-search-meta">⌘K · search across 1,243 players · 64 seasons · 12,824 media items</div>
        </div>
        <div className="hero-stats">
          <div className="hero-stat"><div className="num">64</div><div className="lbl">Seasons</div></div>
          <div className="hero-stat"><div className="num">1,243</div><div className="lbl">Players</div></div>
          <div className="hero-stat"><div className="num">11</div><div className="lbl">Postseasons</div></div>
          <div className="hero-stat"><div className="num">2</div><div className="lbl">WS Titles</div></div>
          <div className="hero-stat"><div className="num">12,824</div><div className="lbl">Media Items</div></div>
        </div>
      </div>
    </section>
  );
}

function EntryGrid() {
  return (
    <section className="section">
      <div className="group-label">
        <span className="num">A</span>
        <span className="name">Browse by Detail</span>
        <span className="desc">— Open a single player, season, or game</span>
      </div>
      <div className="entry-grid three">
        {DETAIL_ENTRIES.map(e => (
          <a className="entry" key={e.key} href={e.href}>
            <div className="e-head">
              <div className={'e-icon ' + e.key}>{e.icon}</div>
              <div className="e-arrow">→</div>
            </div>
            <div className="e-title">{e.title}</div>
            <div className="e-desc">{e.desc}</div>
            <div className="e-meta">
              {e.meta.map((m,i) => <span key={i} className="pill">{m}</span>)}
            </div>
          </a>
        ))}
      </div>

      <div className="group-label">
        <span className="num">B</span>
        <span className="name">Tools & Discover</span>
        <span className="desc">— Rank, compare, browse, watch</span>
      </div>
      <div className="entry-grid four">
        {TOOL_ENTRIES.map(e => (
          <a className="entry" key={e.key} href={e.href}>
            <div className="e-head">
              <div className={'e-icon ' + e.key}>{e.icon}</div>
              <div className="e-arrow">→</div>
            </div>
            <div className="e-title">{e.title}</div>
            <div className="e-desc">{e.desc}</div>
            <div className="e-meta">
              {e.meta.map((m,i) => <span key={i} className="pill">{m}</span>)}
            </div>
          </a>
        ))}
      </div>
    </section>
  );
}

function TodayInHistory() {
  return (
    <section className="section">
      <div className="section-head">
        <div>
          <div className="section-title">Today in Mets History · May 9</div>
          <div className="section-sub">5 things that happened on this date in franchise history</div>
        </div>
        <a href="#" className="section-link">Pick another date →</a>
      </div>
      <div className="today-card">
        {TODAY_HISTORY.map((h,i) => (
          <div className="today-row" key={i}>
            <div className="today-year">{h.year}</div>
            <div className="today-text">
              <div className="t">{h.t}</div>
              <div className="meta">{h.meta}</div>
            </div>
          </div>
        ))}
      </div>
    </section>
  );
}

function RecentlyViewed() {
  const [recent, setRecent] = useState([]);

  useEffect(() => {
    try {
      const raw = localStorage.getItem('mets_recent');
      const list = raw ? JSON.parse(raw) : [];
      setRecent(list);
    } catch (e) { setRecent([]); }
  }, []);

  const clear = () => {
    localStorage.removeItem('mets_recent');
    setRecent([]);
  };

  return (
    <div className="side-card">
      <div className="side-title">
        <span>Recently Viewed</span>
        {recent.length > 0 && <span className="clr" onClick={clear}>Clear</span>}
      </div>
      {recent.length === 0
        ? <div className="recent-empty">
            No history yet.
            <div className="hint">Click around — pages you visit will appear here.</div>
          </div>
        : recent.map((r,i) => (
            <a href={r.href} key={i} className="recent-row" style={{textDecoration:'none', color:'inherit'}}>
              <span className={'recent-tag ' + r.section}>{r.section}</span>
              <span className="recent-name">{r.title}</span>
            </a>
          ))
      }
    </div>
  );
}

function Trending() {
  return (
    <div className="side-card">
      <div className="side-title"><span>Trending This Week</span></div>
      {TRENDING.map((t,i) => (
        <a key={i} href={t.href} className="quicklink">
          <div className="ql-name">{t.name}</div>
          <div className="ql-meta">{t.meta}</div>
        </a>
      ))}
    </div>
  );
}

function HowToUse() {
  return (
    <div className="side-card" style={{background:'linear-gradient(135deg, #FFF7ED 0%, #FFEDD5 100%)', borderColor:'#FED7AA'}}>
      <div className="side-title" style={{borderBottom:'1px solid #FED7AA'}}><span style={{color:'var(--mets-orange)'}}>How to use this site</span></div>
      <div style={{fontSize:12.5, lineHeight:1.55, color:'var(--text-muted)'}}>
        <p style={{marginBottom:8}}><strong style={{color:'var(--text)'}}>1.</strong> Pick a section above (Players, Seasons, Games for details — Leaders, Postseason, Lab, Media to explore).</p>
        <p style={{marginBottom:8}}><strong style={{color:'var(--text)'}}>2.</strong> Inside any page, <span style={{color:'var(--mets-orange)',fontWeight:600}}>orange-underlined names</span> are clickable — they jump to the relevant detail page.</p>
        <p><strong style={{color:'var(--text)'}}>3.</strong> Pages you visit show up in <strong>Recently Viewed</strong> so you can navigate back.</p>
      </div>
    </div>
  );
}

function App() {
  return (
    <>
      <TopBar />
      <Hero />
      <main className="main">
        <div>
          <EntryGrid />
          <TodayInHistory />
        </div>
        <aside>
          <HowToUse />
          <RecentlyViewed />
          <Trending />
        </aside>
      </main>
      <footer className="footer">
        Prototype · Ultimate Mets Database redesign · Statistics shown are illustrative for design purposes only
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
