<title>Mets Leaders · Ultimate Mets Database</title>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<style>
  :root {
    --mets-blue: #002D72; --mets-blue-dark: #001A4A; --mets-orange: #FF5910;
    --mets-orange-light: #FF7A3D; --bg: #FAFAFA; --surface: #FFFFFF;
    --border: #E5E7EB; --text: #111827; --text-muted: #6B7280; --text-light: #9CA3AF;
    --num-font: 'Roboto Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; color: var(--text); background: var(--bg); line-height: 1.5; font-size: 14px; -webkit-font-smoothing: antialiased; }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  a { color: inherit; text-decoration: none; }

  .topbar { background: var(--mets-blue); color: white; border-bottom: 3px solid var(--mets-orange); }
  .topbar-inner { max-width: 1500px; margin: 0 auto; display: flex; align-items: center; padding: 0 24px; height: 56px; }
  .logo { font-weight: 800; font-size: 18px; color: var(--mets-orange); letter-spacing: -0.02em; }
  .logo span { color: white; }
  .nav { display: flex; gap: 4px; margin-left: 40px; flex: 1; }
  .nav button { color: white; padding: 8px 14px; font-size: 13px; font-weight: 500; border-radius: 6px; }
  .nav button:hover { background: rgba(255,255,255,0.1); }
  .nav button.active { background: var(--mets-orange); }
  .nav-tools { display: flex; gap: 12px; align-items: center; }
  .search { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 7px 12px; border-radius: 6px; font-size: 13px; width: 240px; outline: none; }
  .search::placeholder { color: rgba(255,255,255,0.6); }
  .signin { background: var(--mets-orange); color: white; padding: 7px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; }
  .user-avatar-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--mets-orange); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; border: 2px solid rgba(255,255,255,0.3); position: relative; }
  .fav-counter { position: absolute; top: -4px; right: -4px; background: white; color: var(--mets-blue); font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 8px; min-width: 18px; text-align: center; line-height: 1.4; border: 1.5px solid var(--mets-blue); }

  /* Page header */
  .page-header { background: white; border-bottom: 1px solid var(--border); padding: 24px 0 0; }
  .page-header-inner { max-width: 1500px; margin: 0 auto; padding: 0 24px; }
  .page-crumb { font-size: 12px; color: var(--text-muted); }
  .page-crumb a { color: var(--mets-orange); }
  .page-title { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin-top: 6px; }
  .page-sub { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
  .stat-type-toggle { display: inline-flex; margin-top: 18px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .stat-type-toggle button { padding: 8px 18px; font-size: 13px; font-weight: 600; color: var(--text-muted); background: white; }
  .stat-type-toggle button.active { background: var(--mets-blue); color: white; }

  /* Filters */
  .filters { background: white; border-bottom: 1px solid var(--border); padding: 20px 0; }
  .filters-inner { max-width: 1500px; margin: 0 auto; padding: 0 24px; display: flex; gap: 16px; flex-wrap: wrap; align-items: end; }
  .filter-group { display: flex; flex-direction: column; gap: 4px; }
  .filter-label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  .filter-select, .filter-input { background: white; border: 1px solid var(--border); border-radius: 6px; padding: 7px 12px; font-size: 13px; font-family: inherit; min-width: 130px; outline: none; cursor: pointer; }
  .filter-select:focus, .filter-input:focus { border-color: var(--mets-orange); }
  .filter-spacer { flex: 1; }
  .filter-actions { display: flex; gap: 8px; align-items: center; }
  .filter-clear { font-size: 12px; color: var(--text-muted); padding: 7px 10px; border-radius: 6px; }
  .filter-clear:hover { color: var(--mets-orange); background: #FFF7ED; }
  .save-view-btn { padding: 7px 14px; border: 1px solid var(--mets-blue); color: var(--mets-blue); border-radius: 6px; font-size: 12px; font-weight: 600; }
  .save-view-btn:hover { background: var(--mets-blue); color: white; }

  /* Active filter chips */
  .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 24px 16px; max-width: 1500px; margin: 0 auto; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: #FFF7ED; border: 1px solid #FED7AA; color: var(--mets-orange); border-radius: 14px; font-size: 11px; font-weight: 600; }
  .chip .x { cursor: pointer; opacity: 0.7; }
  .chip .x:hover { opacity: 1; }

  /* Stat preset tabs */
  .presets { background: white; border-bottom: 1px solid var(--border); }
  .presets-inner { max-width: 1500px; margin: 0 auto; padding: 0 24px; display: flex; overflow-x: auto; }
  .preset-tab { padding: 12px 16px; color: var(--text-muted); font-size: 13px; font-weight: 500; border-bottom: 3px solid transparent; white-space: nowrap; }
  .preset-tab:hover { color: var(--text); }
  .preset-tab.active { color: var(--mets-blue); border-bottom-color: var(--mets-orange); font-weight: 700; }

  /* Layout */
  .main { max-width: 1500px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: 1fr 320px; gap: 24px; }
  @media (max-width: 1100px) { .main { grid-template-columns: 1fr; } }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  .card-compact { padding: 14px 16px; }
  .card-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .card-title { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  .card-action { font-size: 12px; color: var(--text-muted); }

  /* Leaders table */
  .table-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
  .result-count { font-size: 13px; color: var(--text-muted); }
  .result-count strong { color: var(--text); font-weight: 700; }
  .table-tools { display: flex; gap: 8px; align-items: center; font-size: 12px; }
  .table-tools select { border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px; font-size: 12px; font-family: inherit; }
  .export-btn { padding: 5px 12px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; font-weight: 500; }
  .export-btn:hover { border-color: var(--mets-blue); color: var(--mets-blue); }

  .ldr-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; }
  table.ldr { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.ldr thead th { background: #F3F4F6; color: var(--text); padding: 10px 8px; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 2px solid var(--border); cursor: pointer; white-space: nowrap; user-select: none; text-align: right; }
  table.ldr thead th.left { text-align: left; }
  table.ldr thead th.center { text-align: center; }
  table.ldr thead th.sticky-l { position: sticky; left: 0; z-index: 2; }
  table.ldr thead th.sticky-l-2 { position: sticky; left: 38px; z-index: 2; }
  table.ldr thead th:hover { background: #E5E7EB; }
  table.ldr thead th.sorted .arr { color: var(--mets-orange); }
  table.ldr thead th .arr { color: var(--text-light); font-size: 9px; margin-left: 2px; }
  table.ldr tbody td { padding: 8px; text-align: right; border-bottom: 1px solid #F3F4F6; font-family: var(--num-font); font-size: 12px; }
  table.ldr tbody td.left { text-align: left; font-family: 'Inter'; }
  table.ldr tbody td.center { text-align: center; }
  table.ldr tbody td.sticky-l { position: sticky; left: 0; background: white; z-index: 1; }
  table.ldr tbody td.sticky-l-2 { position: sticky; left: 38px; background: white; z-index: 1; }
  table.ldr tbody tr:hover { background: #FFF7ED; }
  table.ldr tbody tr:hover td.sticky-l, table.ldr tbody tr:hover td.sticky-l-2 { background: #FFF7ED; }
  table.ldr tbody tr.is-fav td.sticky-l { background: #FFEDD5; }
  table.ldr tbody tr.is-fav:hover td.sticky-l { background: #FED7AA; }
  table.ldr .rank { font-weight: 700; color: var(--text-muted); }
  table.ldr .rank.top3 { color: var(--mets-orange); font-weight: 800; }
  table.ldr .name { font-weight: 600; color: var(--mets-blue); }
  table.ldr .name:hover { color: var(--mets-orange); }
  table.ldr .star { width: 38px; padding-left: 12px; }
  table.ldr .star button { color: var(--text-light); font-size: 16px; line-height: 1; }
  table.ldr .star button.on { color: var(--mets-orange); }
  table.ldr .star button:hover { transform: scale(1.2); }
  table.ldr .leader-cell { color: var(--mets-orange); font-weight: 700; }

  /* Pagination */
  .pagination { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-size: 12px; }
  .page-btns { display: flex; gap: 4px; }
  .page-btns button { padding: 5px 11px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; }
  .page-btns button.active { background: var(--mets-blue); color: white; border-color: var(--mets-blue); }
  .page-btns button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Sidebar widgets */
  .fav-empty { text-align: center; padding: 20px 12px; color: var(--text-muted); font-size: 12.5px; line-height: 1.55; }
  .fav-empty .icon { font-size: 32px; opacity: 0.3; margin-bottom: 8px; }
  .fav-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .fav-row:last-child { border-bottom: none; }
  .fav-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--mets-blue); color: white; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .fav-info { flex: 1; min-width: 0; }
  .fav-name { font-size: 13px; font-weight: 600; color: var(--mets-blue); cursor: pointer; }
  .fav-name:hover { color: var(--mets-orange); }
  .fav-meta { font-size: 11px; color: var(--text-muted); font-family: var(--num-font); }
  .fav-remove { color: var(--text-light); font-size: 14px; cursor: pointer; padding: 4px; border-radius: 4px; }
  .fav-remove:hover { color: #EF4444; background: #FEE2E2; }

  .saved-view { padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; cursor: pointer; transition: all 0.15s; }
  .saved-view:last-child { margin-bottom: 0; }
  .saved-view:hover { border-color: var(--mets-orange); background: #FFF7ED; }
  .saved-view-title { font-size: 13px; font-weight: 600; }
  .saved-view-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; font-family: var(--num-font); }
  .saved-view .delete { float: right; color: var(--text-light); }
  .saved-view .delete:hover { color: #EF4444; }

  .trending-link { display: block; padding: 10px 12px; border-radius: 6px; font-size: 13px; color: var(--text); border: 1px solid transparent; }
  .trending-link:hover { background: #FFF7ED; border-color: #FED7AA; }
  .trending-link .arrow { float: right; color: var(--text-light); }
  .trending-link .meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; backdrop-filter: blur(4px); }
  .modal { background: white; border-radius: 12px; padding: 32px; width: 400px; max-width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); position: relative; }
  .modal-title { font-size: 22px; font-weight: 800; color: var(--mets-blue); margin-bottom: 6px; }
  .modal-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 22px; }
  .modal-label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  .modal-input { width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; font: inherit; font-size: 14px; outline: none; margin-bottom: 16px; }
  .modal-input:focus { border-color: var(--mets-orange); box-shadow: 0 0 0 3px rgba(255,89,16,0.1); }
  .modal-submit { width: 100%; background: var(--mets-orange); color: white; padding: 11px; border-radius: 6px; font-size: 14px; font-weight: 600; }
  .modal-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .modal-close { position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; border-radius: 50%; color: var(--text-muted); font-size: 18px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--mets-blue); color: white; padding: 12px 20px; border-radius: 8px; font-size: 13px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.2); z-index: 200; animation: slideUp 0.25s ease-out; }
  @keyframes slideUp { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }

  .footer { max-width: 1500px; margin: 0 auto; padding: 32px 24px; color: var(--text-muted); font-size: 12px; border-top: 1px solid var(--border); text-align: center; }
</style>

const COL_FORMAT = {
  AVG: 3, OBP: 3, SLG: 3, OPS: 3, ISO: 3, BABIP: 3, wOBA: 3,

const AVATAR_COLORS = ['#002D72','#FF5910','#10B981','#8B5CF6','#EC4899','#0EA5E9'];

function fmt(col, val) {
  if (val == null) return '—';
  if (COL_FORMAT[col] === 3) return val === 0 ? '.000' : val.toFixed(3).replace(/^0/, '');
  if (COL_FORMAT[col] === 1) return Number(val).toFixed(1);
  return typeof val === 'number' ? val.toLocaleString() : val;
}
function makeInitials(name) { const p=name.trim().split(/\s+/); return (p.length===1?name.slice(0,2):p[0][0]+p.at(-1)[0]).toUpperCase(); }
function pickColor(s) { let h=0; for (const c of s) h=(h*31+c.charCodeAt(0))>>>0; return AVATAR_COLORS[h%AVATAR_COLORS.length]; }
function useClickOutside(ref, fn) { useEffect(()=>{const cb=e=>{if(ref.current&&!ref.current.contains(e.target))fn();}; document.addEventListener('mousedown',cb); return ()=>document.removeEventListener('mousedown',cb);},[ref,fn]); }

function SignInModal({ onClose, onSignIn }) {
  const [name, setName] = useState('');
  const submit = e => {
    e?.preventDefault();
    const t = name.trim(); if (!t) return;
    onSignIn({ name: t, handle: t.toLowerCase().replace(/\s+/g,'_'), initials: makeInitials(t), color: pickColor(t) });
  };
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}>×</button>
        <div className="modal-title">Sign in to UltimateMets</div>
        <div className="modal-subtitle">Save favorite players, build custom leaderboard views, and share them with friends.</div>
        <form onSubmit={submit}>
          <label className="modal-label">Display name</label>
          <input className="modal-input" autoFocus value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. AmazinFan86" />
          <button className="modal-submit" disabled={!name.trim()}>Sign In</button>
        </form>
      </div>
    </div>
  );
}

function SaveViewModal({ onClose, onSave, currentFilters }) {
  const [name, setName] = useState('');
  const filterDescription = useMemo(() => {
    const parts = [];
    if (currentFilters.era !== 'All Time') parts.push(`Era=${currentFilters.era}`);
    if (currentFilters.pos !== 'ALL') parts.push(`Pos=${currentFilters.pos}`);
    if (currentFilters.season !== 'Career') parts.push(`Season=${currentFilters.season}`);
    if (currentFilters.minPA > 0) parts.push(`Min PA=${currentFilters.minPA}`);
    parts.push(`Preset=${currentFilters.preset}`);
    parts.push(`Sort=${currentFilters.sortCol} ${currentFilters.sortDir}`);
    return parts.join(' · ');
  }, [currentFilters]);

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}>×</button>
        <div className="modal-title">Save this view</div>
        <div className="modal-subtitle">Save the current filter combination so you can return to it later.</div>
        <label className="modal-label">View name</label>
        <input className="modal-input" autoFocus value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. My HOF Picks" />
        <div style={{padding:10,background:'#F9FAFB',borderRadius:6,fontSize:12,color:'var(--text-muted)',marginBottom:16,fontFamily:'var(--num-font)'}}>{filterDescription}</div>
        <button className="modal-submit" disabled={!name.trim()} onClick={()=>{ onSave(name.trim(), filterDescription); }}>Save View</button>
      </div>
    </div>
  );
}

function FilterChips({ filters, setFilters }) {
  const chips = [];
  if (filters.season !== 'Career') chips.push({ k: 'season', v: 'Season: ' + filters.season, reset: 'Career' });
  if (filters.era !== 'All Time')  chips.push({ k: 'era',    v: 'Era: ' + filters.era,        reset: 'All Time' });
  if (filters.pos !== 'ALL')       chips.push({ k: 'pos',    v: 'Pos: ' + filters.pos,        reset: 'ALL' });
  if (filters.minPA > 0)           chips.push({ k: 'minPA',  v: 'Min PA ≥ ' + filters.minPA,  reset: 0 });
  if (filters.q)                   chips.push({ k: 'q',      v: '"' + filters.q + '"',         reset: '' });
  if (chips.length === 0) return null;
  return (
    <div className="filter-chips">
      {chips.map(c => (
        <span className="chip" key={c.k}>
          {c.v} <span className="x" onClick={() => setFilters(f => ({ ...f, [c.k]: c.reset }))}>×</span>
        </span>
      ))}
    </div>
  );
}

function LeadersTable({ rows, columns, sortCol, sortDir, onSort, favorites, onToggleFav, user, onSignInClick, pageSize, page, onPageChange }) {
  const start = (page-1)*pageSize;
  const visible = pageSize === Infinity ? rows : rows.slice(start, start+pageSize);
  const totalPages = pageSize === Infinity ? 1 : Math.ceil(rows.length/pageSize);

  // Identify "leader" cells (top value in each numeric col)
  const leaderValues = useMemo(() => {
    const m = {};
    columns.forEach(c => {
      const vals = rows.map(r => r[c]).filter(v => typeof v === 'number');
      if (vals.length) m[c] = Math.max(...vals);
    });
    return m;
  }, [rows, columns]);

  return (
    <>
    <div className="ldr-table-wrap">
      <table className="ldr">
        <thead>
          <tr>
            <th className="left star">★</th>
            <th className="left center">#</th>
            <th className="left">Player</th>
            <th className="left center">Pos</th>
            <th className="left">Years</th>
            {columns.map(col => (
              <th key={col} className={sortCol === col ? 'sorted' : ''} onClick={() => onSort(col)}>
                {col}<span className="arr">{sortCol===col ? (sortDir==='desc'?'▼':'▲') : '↕'}</span>
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {visible.map((r, i) => {
            const isFav = favorites.has(r.id);
            return (
              <tr key={r.id} className={isFav ? 'is-fav' : ''}>
                <td className="left center sticky-l star">
                  <button className={isFav ? 'on' : ''}
                          title={user ? (isFav?'Remove from favorites':'Add to favorites') : 'Sign in to favorite'}
                          onClick={() => user ? onToggleFav(r.id) : onSignInClick()}>
                    {isFav ? '★' : '☆'}
                  </button>
                </td>
                <td className={'left center rank' + ((start+i+1)<=3?' top3':'')}>{start+i+1}</td>
                <td className="left"><a href={NAV_HREF.Players} className="name linkable" style={{textDecoration:'none', color:'inherit'}}>{r.name}</a></td>
                <td className="left center">{r.pos}</td>
                <td className="left" style={{color:'var(--text-muted)',fontSize:11.5}}>{r.years}</td>
                {columns.map(col => {
                  const v = r[col];
                  const isLeader = typeof v === 'number' && v === leaderValues[col] && rows.length > 1;
                  return <td key={col} className={isLeader ? 'leader-cell' : ''}>{fmt(col, v)}</td>;
                })}
              </tr>
            );
          })}
          {visible.length === 0 && (
            <tr><td colSpan={5+columns.length} style={{padding:30,textAlign:'center',color:'var(--text-muted)'}}>No players match these filters.</td></tr>
          )}
        </tbody>
      </table>
    </div>

    {pageSize !== Infinity && totalPages > 1 && (
      <div className="pagination">
        <div className="result-count">
          Showing <strong>{start+1}–{Math.min(start+pageSize, rows.length)}</strong> of <strong>{rows.length}</strong>
        </div>
        <div className="page-btns">
          <button disabled={page===1} onClick={()=>onPageChange(page-1)}>← Prev</button>
          {[...Array(totalPages)].map((_, i) => (
            <button key={i} className={page===i+1?'active':''} onClick={()=>onPageChange(i+1)}>{i+1}</button>
          ))}
          <button disabled={page===totalPages} onClick={()=>onPageChange(page+1)}>Next →</button>
        </div>
      </div>
    )}
    </>
  );
}

      <div className="card-header"><div className="card-title">📁 Saved Views · {views.length}</div></div>
      {views.length === 0
        ? <div className="fav-empty"><div className="icon">📁</div><div>Configure your filters then click <strong>Save view</strong> in the toolbar to save the current setup.</div></div>
        : views.map(v => (
            <div className="saved-view" key={v.id} onClick={() => onApply(v)}>
              <span className="delete" onClick={e => { e.stopPropagation(); onDelete(v.id); }}>×</span>
              <div className="saved-view-title">{v.name}</div>
              <div className="saved-view-meta">{v.meta}</div>
            </div>
          ))
      }
    </div>
  );
}

function TrendingViews({ onApply }) {
  return (
    <div className="card">
      <div className="card-header"><div className="card-title">🔥 Trending Views</div></div>
      {TRENDING_VIEWS.map((v, i) => (
        <a className="trending-link" key={i} onClick={() => onApply(v)}>
          <span className="arrow">→</span>
          <div>{v.name}</div>
          <div className="meta">{v.meta}</div>
        </a>
      ))}
    </div>
  );
}

/* ============= APP ============= */

function App() {
  const [user, setUser] = useState(null);
  const [showSignIn, setShowSignIn] = useState(false);
  const [showSaveView, setShowSaveView] = useState(false);
  const [filters, setFilters] = useState({ season: 'Career', era: 'All Time', pos: 'ALL', minPA: 0, q: '' });
  const [preset, setPreset] = useState('Dashboard');
  const [sortCol, setSortCol] = useState('bWAR');
  const [sortDir, setSortDir] = useState('desc');
  const [page, setPage] = useState(1);
  const [pageSize, setPageSize] = useState(30);
  const [favorites, setFavorites] = useState(new Set());
  const [savedViews, setSavedViews] = useState([]);
  const [toast, setToast] = useState(null);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2200); };

  const filteredRows = useMemo(() => {
    let rows = [...PLAYERS];
    if (filters.era !== 'All Time') rows = rows.filter(r => r.era === filters.era);
    if (filters.pos !== 'ALL') rows = rows.filter(r => r.pos === filters.pos || (filters.pos==='OF' && ['LF','CF','RF'].includes(r.pos)));
    if (filters.minPA > 0) rows = rows.filter(r => r.PA >= filters.minPA);
    if (filters.q) rows = rows.filter(r => r.name.toLowerCase().includes(filters.q.toLowerCase()));
    rows.sort((a, b) => {
      const av = a[sortCol], bv = b[sortCol];
      if (typeof av === 'number') return sortDir === 'asc' ? av - bv : bv - av;
      return sortDir === 'asc' ? String(av).localeCompare(String(bv)) : String(bv).localeCompare(String(av));
    });
    return rows;
  }, [filters, sortCol, sortDir]);

  const handleSort = (col) => {
    if (sortCol === col) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortCol(col); setSortDir('desc'); }
    setPage(1);
  };

  const onSignIn = (u) => { setUser(u); setShowSignIn(false); setSavedViews(DEFAULT_SAVED_VIEWS); };
  const onSignOut = () => { setUser(null); setFavorites(new Set()); setSavedViews([]); };

  const toggleFav = (id) => {
    setFavorites(prev => {
      const next = new Set(prev);
      if (next.has(id)) { next.delete(id); showToast('Removed from favorites'); }
      else { next.add(id); showToast('★ Added to favorites'); }
      return next;
    });
  };

  const handleSaveView = (name, meta) => {
    setSavedViews(views => [...views, { id: Date.now(), name, meta, filter: { ...filters, preset, sortCol, sortDir } }]);
    setShowSaveView(false);
    showToast('📁 View saved');
  };

  const applyView = (v) => {
    if (v.filter) {
      setFilters(f => ({ ...f, ...v.filter }));
      if (v.filter.preset) setPreset(v.filter.preset);
      if (v.filter.sortCol) setSortCol(v.filter.sortCol);
      if (v.filter.sortDir) setSortDir(v.filter.sortDir);
      setPage(1);
      showToast('Loaded: ' + v.name);
    }
  };

  const columns = PRESETS[preset].cols;

  return (
    <>
      <TopBar user={user} favCount={favorites.size} onSignInClick={()=>setShowSignIn(true)} onSignOut={onSignOut} />

      <section className="page-header">
        <div className="page-header-inner">
          <div className="page-crumb"><a>Home</a> / Leaders</div>
          <div className="page-title">Mets Leaderboards</div>
          <div className="page-sub">All-time franchise leaders · Career & single-season stats since 1962</div>
          <div className="stat-type-toggle">
            <button className="active">Batting</button>
            <button>Pitching</button>
            <button>Fielding</button>
          </div>
        </div>
        <FilterBar filters={filters} setFilters={(f)=>{ setFilters(f); setPage(1); }} onSaveView={() => user ? setShowSaveView(true) : setShowSignIn(true)} user={user} />
        <FilterChips filters={filters} setFilters={(f)=>{ setFilters(f); setPage(1); }} />
      </section>

      <PresetTabs presets={Object.keys(PRESETS)} active={preset} onChange={(p)=>{ setPreset(p); setSortCol(PRESETS[p].default); setSortDir('desc'); setPage(1); }} />

      <main className="main">
        <div className="content">
          <div className="card">
            <div className="table-toolbar">
              <div className="result-count">
                <strong>{filteredRows.length}</strong> players · sorted by <strong>{sortCol}</strong> {sortDir === 'desc' ? '↓' : '↑'}
              </div>
              <div className="table-tools">
                <span style={{color:'var(--text-muted)'}}>Show:</span>
                <select value={pageSize} onChange={e => { setPageSize(e.target.value === 'Infinity' ? Infinity : parseInt(e.target.value)); setPage(1); }}>
                  <option value="10">10</option>
                  <option value="30">30</option>
                  <option value="50">50</option>
                  <option value="100">100</option>
                  <option value="Infinity">All</option>
                </select>
                <button className="export-btn" onClick={() => showToast('CSV export — Members only')}>↓ Export CSV</button>
                <button className="export-btn" onClick={() => { navigator.clipboard?.writeText(window.location.href); showToast('🔗 Link copied'); }}>↗ Share view</button>
              </div>
            </div>

            <LeadersTable
              rows={filteredRows}
              columns={columns}
              sortCol={sortCol}
              sortDir={sortDir}
              onSort={handleSort}
              favorites={favorites}
              onToggleFav={toggleFav}
              user={user}
              onSignInClick={() => setShowSignIn(true)}
              pageSize={pageSize}
              page={page}
              onPageChange={setPage}
            />
          </div>
        </div>

        <aside className="sidebar">
          <MyFavorites
            favorites={favorites}
            allPlayers={PLAYERS}
            user={user}
            onSignInClick={() => setShowSignIn(true)}
            onRemove={(id) => { setFavorites(prev => { const n = new Set(prev); n.delete(id); return n; }); }}
            onClearAll={() => { setFavorites(new Set()); showToast('Favorites cleared'); }}
          />
          <SavedViews
            views={savedViews}
            user={user}
            onSignInClick={() => setShowSignIn(true)}
            onApply={applyView}
            onDelete={(id) => { setSavedViews(vs => vs.filter(v => v.id !== id)); showToast('View deleted'); }}
          />
          <TrendingViews onApply={applyView} />
        </aside>
      </main>

      <footer className="footer">
        Prototype · Leaderboards page · Statistics shown are illustrative for design purposes
      </footer>

      {showSignIn && <SignInModal onClose={()=>setShowSignIn(false)} onSignIn={onSignIn} />}
      {showSaveView && <SaveViewModal onClose={()=>setShowSaveView(false)} onSave={handleSaveView} currentFilters={{...filters, preset, sortCol, sortDir}} />}
      {toast && <div className="toast">{toast}</div>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<!-- ===== Cross-page UX helpers (breadcrumb + recent-tracker + .linkable styles) ===== -->
<script>
(function() {
  var FILES = {
    'index.html':                     { section: 'home',       name: 'Home' },
    'player-prototype-react.html':    { section: 'players',    name: 'Players' },
    'player-prototype.html':          { section: 'players',    name: 'Players' },
    'season-prototype-react.html':    { section: 'seasons',    name: 'Seasons' },
    'game-prototype-react.html':      { section: 'games',      name: 'Games' },
    'leaders-prototype-react.html':   { section: 'leaders',    name: 'Leaders' },
    'postseason-prototype-react.html':{ section: 'postseason', name: 'Postseason' },
    'comparison-prototype-react.html':{ section: 'lab',        name: 'Lab' },
    'media-prototype-react.html':     { section: 'media',      name: 'Media' },
  };
  var here = location.pathname.split('/').pop() || 'index.html';
  var hereInfo = FILES[here] || { section: 'other', name: 'Page' };
  var hereTitle = (document.title.split(' | ')[0].split(' · ')[0]).trim();

  try {
    var style = document.createElement('style');
    style.textContent = '.linkable{cursor:pointer;transition:color 0.1s;}.linkable:hover{color:#FF5910!important;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#FF5910;}tr.linkable-row{cursor:pointer;}tr.linkable-row:hover{background:#FFF7ED!important;}tr.linkable-row:hover td:first-child{color:#FF5910;}.linkable-card{cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;}.linkable-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,0.08);border-color:#FF5910!important;}';
    document.head.appendChild(style);
  } catch (e) {}

  try {
    if (here !== 'index.html') {
      var item = { section: hereInfo.section, title: hereTitle, href: here, at: Date.now() };
      var recent = JSON.parse(localStorage.getItem('mets_recent') || '[]');
      recent = [item].concat(recent.filter(function(r){ return r.href !== here; })).slice(0, 8);
      localStorage.setItem('mets_recent', JSON.stringify(recent));
    }
  } catch (e) {}

  try {
    if (!document.referrer) return;
    var refUrl = new URL(document.referrer);
    if (refUrl.origin !== location.origin) return;
    var refFile = refUrl.pathname.split('/').pop() || 'index.html';
    if (refFile === here) return;
    var fromInfo = FILES[refFile];
    if (!fromInfo) return;
    var banner = document.createElement('div');
    banner.style.cssText = 'background:#FFF7ED;border-bottom:1px solid #FED7AA;padding:7px 24px;font-size:12px;display:flex;align-items:center;gap:8px;font-family:Inter,system-ui,sans-serif;flex-wrap:wrap;';
    banner.innerHTML = '<a href="' + document.referrer + '" style="color:#FF5910;text-decoration:none;font-weight:600;">← Back to ' + fromInfo.name + '</a><span style="color:#9CA3AF;margin-left:auto;font-size:11.5px;">You are here: <strong style="color:#111827;">' + hereTitle + '</strong></span>';
    document.body.insertBefore(banner, document.body.firstChild);
  } catch (e) {}
})();
</script>
</body>
</html>
