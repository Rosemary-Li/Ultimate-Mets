name: Build and Deploy to Cloud Run

on:
  push:
    branches: [ "main" ] # only trigger on push to the main branch

env:
  PROJECT_ID: ultimate-mets
  REGION: us-east1
  REPOSITORY: ultimate-mets-repo # Artifact Registry repository name

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Authenticate to Google Cloud
      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # 2. Set up the gcloud CLI
      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      # 3. Configure Docker authentication
      - name: 'Docker Auth'
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # --- Deploy the web app ---
      - name: Build and Push Web Image
        run: |-
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/web:${{ github.sha }} ./web
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/web:${{ github.sha }}

      - name: Deploy Web to Cloud Run
        run: |-
          gcloud run deploy ultimate-mets-web \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/web:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --add-cloudsql-instances ${{ env.PROJECT_ID }}:${{ env.REGION }}:mets-pg \
            --set-secrets DATABASE_URL=DATABASE_URL:latest,AUTH_SECRET=AUTH_SECRET:latest,AUTH_GOOGLE_ID=AUTH_GOOGLE_ID:latest,AUTH_GOOGLE_SECRET=AUTH_GOOGLE_SECRET:latest,AUTH_RESEND_KEY=AUTH_RESEND_KEY:latest \
            --set-env-vars AUTH_URL=https://ultimate-mets-web-uo27d5n5oa-ue.a.run.app,AUTH_TRUST_HOST=true,AUTH_EMAIL_FROM=onboarding@resend.dev
            # NOTE: AUTH_URL + AUTH_EMAIL_FROM point at the run.app URL / Resend test
            # sender for now. When ultimatemets.com is live and verified in Resend,
            # switch to AUTH_URL=https://ultimatemets.com and AUTH_EMAIL_FROM=noreply@ultimatemets.com.

      # --- Deploy the data pipeline job ---
      - name: Build and Push Pipeline Image
        run: |-
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/pipeline:${{ github.sha }} ./data-pipeline
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/pipeline:${{ github.sha }}

      - name: Deploy Cloud Run Job
        run: |-
          gcloud run jobs deploy mets-pipeline \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/pipeline:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --set-cloudsql-instances ${{ env.PROJECT_ID }}:${{ env.REGION }}:mets-pg \
            --set-secrets DATABASE_URL=DATABASE_URL:latest
